name: Automatically build and publish this plugin

on:
  push:
    branches:
      - 'master'

jobs:

  build-and-publish-plugin:
    runs-on: ubuntu-latest
    name: Build and publish plugin
    permissions:
      contents: write
    steps:

    # Checkout at the workspace root: the repo generator resolves the repository URL for
    #   the published repo.json from 'git remote get-url --push origin' in this directory.
    - name: Checkout plugin
      uses: actions/checkout@v4

    # The generator reads plugin sources from '<workspace>/source/<plugin_id>', so stage the
    #   plugin files into a subdirectory named after its plugin id.
    - name: Stage plugin source
      shell: bash
      run: |
        mkdir -p source/mover2_cleanup
        find . -maxdepth 1 -type f -exec cp {} source/mover2_cleanup/ \;

    # Identity for the generated repository
    - name: Write repository config
      shell: bash
      run: |
        cat << EOF > config.json
        {
            "id": "repository.roormonger",
            "name": "roormonger plugins",
            "icon": ""
        }
        EOF

    # Build the plugin bundle + repo.json and publish them to the 'repo' branch.
    #   This is what Unmanic reads when this repository is added to it.
    - name: Generate and deploy plugin repository
      uses: Unmanic/action.generate-unmanic-plugin-repo@master
      with:
        deploy_repo: 'true'
        github_token: ${{ secrets.GITHUB_TOKEN }}
